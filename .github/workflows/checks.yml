name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_DOTENV: '1'
  EXPO_PUBLIC_APP_ENV: staging
  EXPO_PUBLIC_SUPABASE_URL: https://patanos-ci.invalid
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder
  SENTRY_DISABLE_AUTO_UPLOAD: 'true'

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-fund
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run db:check
      - run: npx --no-install expo install --check
      - run: npm run export:android -- --output-dir dist/ci-android

  local-database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-fund
      # No link/access token: operates only on this job's disposable Docker stack.
      - run: npm run db:start > /dev/null
      - run: npm run db:reset:local
      - run: npm run db:test
      - run: node scripts/test-session-auth.cjs
      - run: npm run db:test:api
      - if: always()
        run: npx --no-install supabase stop --no-backup
